server:
  port: 8090

spring:
  application:
    name: chat-ui
  mvc:
    async:
      request-timeout: -1   # required for long-lived SSE streaming connections
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicecodechat}
    username: ${DB_USERNAME:scc}
    password: ${DB_PASSWORD:scc_secret}
    driver-class-name: org.postgresql.Driver
  cloud:
    openfeign:
      client:
        config:
          chat-api:
            connectTimeout: 5000
            readTimeout: 180000   # 3 min — Ollama LLM inference on CPU can be slow
          ingestion-api:
            connectTimeout: 5000
            readTimeout: 600000   # 10 min — large PDF ingestion + embedding

# URL of the ServiceCodeChat backend API
backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8080}

# Fixed credentials — change via environment variable in production
app:
  auth:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:changeme}
