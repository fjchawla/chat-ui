<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ServiceCodeChat — Sign In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 1.5rem;
        }
        h1 { color: #f1f5f9; font-size: 1.5rem; font-weight: 700; }
        .subtitle { color: #94a3b8; font-size: 0.875rem; }
        .form-label { color: #cbd5e1; font-size: 0.875rem; font-weight: 500; }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-radius: 8px;
            padding: 0.625rem 0.875rem;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: #6366f1;
            color: #f1f5f9;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }
        .form-control::placeholder { color: #475569; }
        .btn-sign-in {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 8px;
            padding: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: opacity 0.2s;
        }
        .btn-sign-in:hover { opacity: 0.9; }
        .alert-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            border-radius: 8px;
            font-size: 0.875rem;
        }
        .alert-success {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.3);
            color: #86efac;
            border-radius: 8px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon">💬</div>
        <h1>ServiceCodeChat</h1>
        <p class="subtitle mt-1">Sign in to continue</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error p-3 mb-3">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-success p-3 mb-3">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="Enter username" autofocus autocomplete="username"/>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Enter password" autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-sign-in btn-primary w-100">Sign In</button>
    </form>
</div>
</body>
</html>
