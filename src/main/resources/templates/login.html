<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — ServiceCodeChat</title>
    <link rel="stylesheet" href="/css/main.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--clr-bg);
        }

        .login-surface {
            width: 100%;
            max-width: 400px;
        }

        /* Brand mark */
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            text-align: center;
        }
        .login-icon {
            width: 56px; height: 56px;
            background: var(--clr-primary-container);
            background-image: linear-gradient(135deg, rgba(190,194,255,0.3), transparent);
            border-radius: var(--r-lg);
            display: flex; align-items: center; justify-content: center;
        }
        .login-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--clr-on-surface);
        }
        .login-sub {
            font-size: 14px;
            color: var(--clr-on-surf-var);
            margin-top: 2px;
        }

        /* Card */
        .login-card {
            background: var(--clr-surf-base);
            background-image: linear-gradient(var(--elev-1), var(--elev-1));
            border: 1px solid var(--clr-outline-var);
            border-radius: var(--r-xl);
            padding: 28px 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Field override: label bg matches card */
        .login-card .md-field label { --md-field-bg: var(--clr-surf-base); }
        .login-card .md-field input { background: var(--clr-surf-low); }
        .login-card .md-field input:focus { background: var(--clr-surf-low); }

        /* Alerts */
        .login-alert {
            border-radius: var(--r-sm);
            padding: 12px 14px;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.45;
        }
        .login-alert.error   { background: var(--clr-error-cont);   color: var(--clr-error); }
        .login-alert.success { background: var(--clr-success-cont);  color: var(--clr-success); }

        /* Submit button */
        .btn-signin {
            all: unset;
            cursor: pointer;
            width: 100%;
            height: 48px;
            border-radius: var(--r-full);
            background: var(--clr-primary);
            color: var(--clr-on-primary);
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
            text-align: center;
            display: flex; align-items: center; justify-content: center;
            transition: box-shadow var(--dur-s) var(--ease);
            position: relative; overflow: hidden;
            margin-top: 4px;
        }
        .btn-signin::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--clr-on-primary);
            opacity: 0;
            transition: opacity var(--dur-s);
            border-radius: inherit;
        }
        .btn-signin:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.4), 0 2px 10px rgba(190,194,255,0.15); }
        .btn-signin:hover::before  { opacity: 0.08; }
        .btn-signin:active::before { opacity: 0.12; }

        /* Fields layout */
        .fields { display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>
<body>
<div class="login-surface fade-up">
    <div class="login-brand">
        <div class="login-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"
                      fill="var(--clr-on-primary-container)"/>
                <circle cx="8" cy="11" r="1.4" fill="var(--clr-primary-container)"/>
                <circle cx="12" cy="11" r="1.4" fill="var(--clr-primary-container)"/>
                <circle cx="16" cy="11" r="1.4" fill="var(--clr-primary-container)"/>
            </svg>
        </div>
        <div>
            <div class="login-title">ServiceCodeChat</div>
            <div class="login-sub">Sign in to your account</div>
        </div>
    </div>

    <div class="login-card">

        <div th:if="${param.error}" class="login-alert error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="login-alert success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14l-4-4 1.41-1.41L10 13.17l6.59-6.59L18 8l-8 8z"/>
            </svg>
            You've been signed out successfully.
        </div>

        <form th:action="@{/login}" method="post" class="fields">
            <div class="md-field">
                <input type="text" id="username" name="username"
                       placeholder=" " autofocus autocomplete="username"/>
                <label for="username">Username</label>
            </div>
            <div class="md-field">
                <input type="password" id="password" name="password"
                       placeholder=" " autocomplete="current-password"/>
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn-signin">Sign In</button>
        </form>

    </div>
</div>
</body>
</html>
