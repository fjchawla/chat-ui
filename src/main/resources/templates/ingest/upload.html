<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Upload Document — ServiceCodeChat</title>
    <style>
        :root {
            --bg-base:    #0f172a;
            --bg-surface: #1e293b;
            --bg-raised:  #273549;
            --border:     #334155;
            --text-primary:   #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:     #64748b;
            --accent:         #6366f1;
            --accent-hover:   #4f46e5;
            --success:        #22c55e;
            --error:          #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Shared Nav ─────────────────────────────────────────────── */
        .top-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            height: 56px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            display: flex; align-items: center; gap: 0.625rem;
            font-weight: 700; font-size: 1rem; color: var(--text-primary);
        }
        .brand-dot {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .user-info { font-size: 0.8rem; color: var(--text-secondary); }
        .btn-logout {
            font-size: 0.8rem; padding: 0.3rem 0.8rem; border-radius: 6px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
        }
        .btn-logout:hover { border-color: var(--error); color: var(--error); }
        .tab-bar {
            background: var(--bg-surface); border-bottom: 1px solid var(--border);
            padding: 0 1.25rem; display: flex; gap: 0.125rem; flex-shrink: 0;
        }
        .tab {
            display: flex; align-items: center; gap: 0.375rem;
            padding: 0 0.875rem; height: 40px;
            font-size: 0.8125rem; font-weight: 500; color: var(--text-secondary);
            text-decoration: none; border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s; white-space: nowrap;
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* ── Page layout ─────────────────────────────────────────────── */
        .page-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 560px;
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.375rem;
        }
        .page-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* ── Upload card ─────────────────────────────────────────────── */
        .upload-card {
            width: 100%;
            max-width: 560px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--accent);
            background: rgba(99,102,241,0.05);
        }
        .drop-icon {
            width: 56px; height: 56px;
            background: rgba(99,102,241,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin: 0 auto 1rem;
        }
        .drop-title { font-size: 0.9375rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem; }
        .drop-sub { font-size: 0.8rem; color: var(--text-muted); }
        .drop-sub span { color: var(--accent); }
        #file-input { display: none; }

        .file-info {
            display: none;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            display: none;
            align-items: center;
            gap: 0.75rem;
        }
        .file-info.visible { display: flex; }
        .file-icon {
            width: 36px; height: 36px; flex-shrink: 0;
            background: rgba(99,102,241,0.12);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .file-name { font-size: 0.85rem; color: var(--text-primary); word-break: break-all; flex: 1; }
        .file-size { font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
        .file-clear {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; padding: 0.25rem; border-radius: 4px;
            transition: color 0.15s; font-size: 1rem; line-height: 1;
        }
        .file-clear:hover { color: var(--error); }

        .btn-upload {
            background: var(--accent);
            color: white; border: none; border-radius: 10px;
            padding: 0.7rem 1.25rem;
            font-size: 0.875rem; font-weight: 600;
            width: 100%; cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-upload:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-upload:disabled { opacity: 0.45; cursor: not-allowed; }

        .upload-status {
            border-radius: 10px;
            padding: 0.875rem 1rem;
            font-size: 0.85rem;
            display: none;
        }
        .upload-status.visible { display: block; }
        .upload-status.loading {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.25);
            color: #a5b4fc;
        }
        .upload-status.success {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.25);
            color: #86efac;
        }
        .upload-status.error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
        }

        .result-card {
            display: none;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            font-size: 0.85rem;
        }
        .result-card.visible { display: block; }
        .result-row { display: flex; justify-content: space-between; padding: 0.3rem 0; }
        .result-row:not(:last-child) { border-bottom: 1px solid rgba(51,65,85,0.5); }
        .result-label { color: var(--text-muted); font-size: 0.775rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .result-value { color: var(--text-primary); font-weight: 500; text-align: right; }
        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .status-badge.done    { background: rgba(34,197,94,0.15); color: #86efac; }
        .status-badge.failed  { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .status-badge.running { background: rgba(99,102,241,0.15); color: #a5b4fc; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hint {
            font-size: 0.775rem;
            color: var(--text-muted);
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar('upload')}"></div>

<div class="page-content">
    <div class="page-header">
        <h1>Upload Document</h1>
        <p>Upload a PDF to add its content to the knowledge base. Large documents may take several minutes to ingest.</p>
    </div>

    <div class="upload-card">

        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <div class="drop-icon">📄</div>
            <div class="drop-title">Drop your PDF here</div>
            <div class="drop-sub">or <span>click to browse</span> — PDF only, max 200 MB</div>
            <input type="file" id="file-input" accept=".pdf"/>
        </div>

        <div class="file-info" id="file-info">
            <div class="file-icon">📎</div>
            <div class="file-name" id="file-name"></div>
            <div class="file-size" id="file-size"></div>
            <button class="file-clear" onclick="clearFile()" title="Remove">✕</button>
        </div>

        <button class="btn-upload" id="upload-btn" disabled onclick="uploadFile()">
            Upload &amp; Ingest
        </button>

        <div class="upload-status" id="upload-status"></div>
        <div class="result-card"  id="result-card"></div>

        <p class="hint">Ingestion runs synchronously — the page will show results when complete.</p>
    </div>
</div>

<script>
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const fileInfo  = document.getElementById('file-info');
    const fileNameEl = document.getElementById('file-name');
    const fileSizeEl = document.getElementById('file-size');
    const statusEl  = document.getElementById('upload-status');
    const resultEl  = document.getElementById('result-card');

    let selectedFile = null;

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) selectFile(fileInput.files[0]);
    });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault(); dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
    });

    function selectFile(file) {
        if (!file.name.toLowerCase().endsWith('.pdf')) {
            showStatus('error', '✗ Only PDF files are accepted.');
            return;
        }
        selectedFile = file;
        fileNameEl.textContent = file.name;
        fileSizeEl.textContent = formatBytes(file.size);
        fileInfo.classList.add('visible');
        uploadBtn.disabled = false;
        hideStatus();
        resultEl.classList.remove('visible');
    }

    function clearFile() {
        selectedFile = null;
        fileInput.value = '';
        fileInfo.classList.remove('visible');
        uploadBtn.disabled = true;
        hideStatus();
        resultEl.classList.remove('visible');
    }

    async function uploadFile() {
        if (!selectedFile) return;

        showStatus('loading', null);
        uploadBtn.disabled = true;
        resultEl.classList.remove('visible');

        const form = new FormData();
        form.append('file', selectedFile);

        try {
            const res = await fetch('/api/upload', { method: 'POST', body: form });
            const data = await res.json();

            if (!res.ok) {
                showStatus('error', '✗ ' + (data.error || 'Upload failed.'));
            } else if (data.status === 'FAILED') {
                showStatus('error', '✗ Ingestion failed: ' + (data.errorMessage || 'Unknown error'));
            } else {
                showStatus('success', '✓ Document ingested successfully.');
                renderResult(data);
                clearFile();
            }
        } catch (e) {
            showStatus('error', '✗ Upload error: ' + e.message);
        } finally {
            uploadBtn.disabled = false;
        }
    }

    function showStatus(type, msg) {
        statusEl.className = 'upload-status visible ' + type;
        if (type === 'loading') {
            statusEl.innerHTML = '<div style="display:flex;align-items:center;gap:0.6rem"><div class="spinner"></div>Uploading and ingesting… this may take several minutes.</div>';
        } else {
            statusEl.textContent = msg;
        }
    }

    function hideStatus() {
        statusEl.className = 'upload-status';
    }

    function renderResult(d) {
        const statusCls = (d.status || 'done').toLowerCase();
        resultEl.innerHTML = `
            <div class="result-row">
                <span class="result-label">Status</span>
                <span class="result-value"><span class="status-badge ${statusCls}">${d.status || 'DONE'}</span></span>
            </div>
            ${d.jobId != null ? `<div class="result-row"><span class="result-label">Job ID</span><span class="result-value">#${d.jobId}</span></div>` : ''}
            ${d.sourceFile ? `<div class="result-row"><span class="result-label">File</span><span class="result-value" style="font-size:0.8rem">${escHtml(d.sourceFile)}</span></div>` : ''}
            ${d.chunksIngested != null ? `<div class="result-row"><span class="result-label">Chunks Ingested</span><span class="result-value">${d.chunksIngested}</span></div>` : ''}
            ${d.errorMessage ? `<div class="result-row"><span class="result-label">Error</span><span class="result-value" style="color:#fca5a5;font-size:0.8rem">${escHtml(d.errorMessage)}</span></div>` : ''}
        `;
        resultEl.classList.add('visible');
    }

    function formatBytes(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
    }

    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
