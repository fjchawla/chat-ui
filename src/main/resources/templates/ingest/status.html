<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ingestion Status — ServiceCodeChat</title>
    <style>
        :root {
            --bg-base:    #0f172a;
            --bg-surface: #1e293b;
            --bg-raised:  #273549;
            --border:     #334155;
            --text-primary:   #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:     #64748b;
            --accent:         #6366f1;
            --accent-hover:   #4f46e5;
            --success:        #22c55e;
            --error:          #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Shared Nav ─────────────────────────────────────────────── */
        .top-bar { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0 1.25rem; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { display: flex; align-items: center; gap: 0.625rem; font-weight: 700; font-size: 1rem; color: var(--text-primary); }
        .brand-dot { width: 32px; height: 32px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .user-info { font-size: 0.8rem; color: var(--text-secondary); }
        .btn-logout { font-size: 0.8rem; padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
        .btn-logout:hover { border-color: var(--error); color: var(--error); }
        .tab-bar { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0 1.25rem; display: flex; gap: 0.125rem; flex-shrink: 0; }
        .tab { display: flex; align-items: center; gap: 0.375rem; padding: 0 0.875rem; height: 40px; font-size: 0.8125rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
        .tab:hover { color: var(--text-primary); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* ── Page layout ─────────────────────────────────────────────── */
        .page-content {
            flex: 1;
            padding: 2.5rem 1.5rem;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── Status header ───────────────────────────────────────────── */
        .status-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.75rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .status-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .status-header p  { font-size: 0.875rem; color: var(--text-secondary); }

        .refresh-controls {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            flex-shrink: 0;
        }
        .refresh-meta { text-align: right; }
        .last-updated { font-size: 0.775rem; color: var(--text-muted); display: block; }
        .countdown-wrap {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.775rem;
            color: var(--text-secondary);
        }
        .countdown-ring {
            position: relative;
            width: 20px; height: 20px;
        }
        .countdown-ring svg { transform: rotate(-90deg); }
        .countdown-ring .track { stroke: var(--border); fill: none; }
        .countdown-ring .progress { stroke: var(--accent); fill: none; transition: stroke-dashoffset 1s linear; stroke-linecap: round; }
        #countdown-num { font-weight: 600; color: var(--accent); }

        .btn-refresh {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.45rem 0.875rem;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-refresh:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); }
        .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-refresh svg { width: 13px; height: 13px; fill: currentColor; }
        .spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Status items ────────────────────────────────────────────── */
        #status-container { display: flex; flex-direction: column; gap: 0.625rem; }

        .status-item {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .status-badge {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.625rem; border-radius: 5px;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
            white-space: nowrap;
        }
        .status-badge.done    { background: rgba(34,197,94,0.15); color: #86efac; }
        .status-badge.failed  { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .status-badge.running { background: rgba(99,102,241,0.15); color: #a5b4fc; }
        .status-badge.info    { background: rgba(99,102,241,0.1); color: var(--text-secondary); }

        .item-main { min-width: 0; }
        .item-title {
            font-size: 0.875rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }
        .item-detail { font-size: 0.775rem; color: var(--text-secondary); }

        .item-meta { text-align: right; flex-shrink: 0; }
        .meta-val { font-size: 0.8rem; color: var(--text-primary); font-weight: 500; }
        .meta-label { font-size: 0.7rem; color: var(--text-muted); }

        /* ── Empty / error states ────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
        .empty-title { font-size: 0.9375rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.375rem; }
        .empty-sub { font-size: 0.8125rem; }

        .error-banner {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px;
            padding: 0.875rem 1rem;
            color: #fca5a5;
            font-size: 0.85rem;
        }

        /* ── Info message row (for placeholder backend responses) ────── */
        .info-item {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            font-size: 0.85rem;
            animation: fadeIn 0.25s ease;
        }
        .info-item-msg    { color: var(--text-primary); margin-bottom: 0.25rem; }
        .info-item-detail { font-size: 0.8rem; color: var(--text-secondary); }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar('status')}"></div>

<div class="page-content">
    <div class="status-header">
        <div>
            <h1>Ingestion Status</h1>
            <p>Live view of ingestion jobs. Refreshes automatically every 15 seconds.</p>
        </div>
        <div class="refresh-controls">
            <div class="refresh-meta">
                <span class="last-updated" id="last-updated">—</span>
                <div class="countdown-wrap" id="countdown-wrap" style="display:none">
                    <div class="countdown-ring">
                        <svg width="20" height="20" viewBox="0 0 20 20">
                            <circle class="track"    cx="10" cy="10" r="8" stroke-width="2"/>
                            <circle class="progress" cx="10" cy="10" r="8" stroke-width="2"
                                    id="progress-circle"
                                    stroke-dasharray="50.27"
                                    stroke-dashoffset="0"/>
                        </svg>
                    </div>
                    Next in <span id="countdown-num">15</span>s
                </div>
            </div>
            <button class="btn-refresh" id="refresh-btn" onclick="fetchStatus()">
                <svg viewBox="0 0 24 24" id="refresh-icon"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                Refresh
            </button>
        </div>
    </div>

    <div id="status-container">
        <div class="empty-state">
            <div class="empty-icon">⏳</div>
            <div class="empty-title">Loading status…</div>
        </div>
    </div>
</div>

<script>
    const INTERVAL = 15; // seconds
    const CIRCUMFERENCE = 50.27; // 2 * PI * 8

    let countdown = INTERVAL;
    let timer = null;
    let isFetching = false;

    async function fetchStatus() {
        if (isFetching) return;
        isFetching = true;
        countdown = INTERVAL;

        const btn = document.getElementById('refresh-btn');
        const icon = document.getElementById('refresh-icon');
        btn.disabled = true;
        icon.classList.add('spinning');

        try {
            const res = await fetch('/api/ingest/status');
            const data = await res.json();

            if (!res.ok) {
                renderError(data.error || 'Failed to fetch status.');
            } else {
                renderStatus(Array.isArray(data) ? data : []);
            }

            const now = new Date();
            document.getElementById('last-updated').textContent =
                'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('countdown-wrap').style.display = 'flex';
        } catch (e) {
            renderError('Could not reach server: ' + e.message);
        } finally {
            isFetching = false;
            btn.disabled = false;
            icon.classList.remove('spinning');
        }
    }

    function renderStatus(items) {
        const container = document.getElementById('status-container');

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">No ingestion jobs found</div>
                    <div class="empty-sub">Upload a document or trigger ingestion to get started.</div>
                </div>`;
            return;
        }

        // Detect shape: IngestionStatus vs placeholder {message, detail}
        const isIngestionStatus = items[0] && (items[0].jobId !== undefined || items[0].sourceFile !== undefined || items[0].status !== undefined);

        if (isIngestionStatus) {
            container.innerHTML = items.map(item => renderIngestionItem(item)).join('');
        } else {
            container.innerHTML = items.map(item => renderInfoItem(item)).join('');
        }
    }

    function renderIngestionItem(d) {
        const statusCls = (d.status || 'done').toLowerCase();
        const statusLabel = d.status || 'UNKNOWN';
        const sourceFile = d.sourceFile ? d.sourceFile.split(/[/\\]/).pop() : '—';
        const chunks = d.chunksIngested != null ? d.chunksIngested : '—';

        return `<div class="status-item">
            <span class="status-badge ${statusCls}">${statusLabel}</span>
            <div class="item-main">
                <div class="item-title">${escHtml(sourceFile)}</div>
                ${d.errorMessage ? `<div class="item-detail" style="color:#fca5a5">${escHtml(d.errorMessage)}</div>` : ''}
                ${d.jobId != null ? `<div class="item-detail">Job #${d.jobId}</div>` : ''}
            </div>
            <div class="item-meta">
                <div class="meta-val">${chunks}</div>
                <div class="meta-label">chunks</div>
            </div>
        </div>`;
    }

    function renderInfoItem(d) {
        return `<div class="info-item">
            <div class="info-item-msg">${escHtml(d.message || JSON.stringify(d))}</div>
            ${d.detail ? `<div class="info-item-detail">${escHtml(d.detail)}</div>` : ''}
        </div>`;
    }

    function renderError(msg) {
        document.getElementById('status-container').innerHTML =
            `<div class="error-banner">⚠ ${escHtml(msg)}</div>`;
    }

    // ── Countdown timer ────────────────────────────────────────────────
    function tick() {
        countdown = Math.max(0, countdown - 1);
        document.getElementById('countdown-num').textContent = countdown;

        // Update ring (full = 0 offset, empty = CIRCUMFERENCE offset)
        const offset = CIRCUMFERENCE * (1 - countdown / INTERVAL);
        document.getElementById('progress-circle').style.strokeDashoffset = offset;

        if (countdown === 0) {
            fetchStatus();
        }
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Boot ────────────────────────────────────────────────────────────
    fetchStatus();
    timer = setInterval(tick, 1000);
</script>
</body>
</html>
