<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navbar(activePage)">
    <div class="top-bar">
        <div class="navbar-brand">
            <div class="brand-dot">💬</div>
            ServiceCodeChat
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem">
            <span class="user-info">Signed in as <strong sec:authentication="name">user</strong></span>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button type="submit" class="btn-logout">Sign out</button>
            </form>
        </div>
    </div>
    <div class="tab-bar">
        <a th:href="@{/}" th:class="${activePage == 'chat'} ? 'tab active' : 'tab'">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            Chat
        </a>
        <a th:href="@{/ingest/upload}" th:class="${activePage == 'upload'} ? 'tab active' : 'tab'">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
            Upload Document
        </a>
        <a th:href="@{/ingest/trigger}" th:class="${activePage == 'trigger'} ? 'tab active' : 'tab'">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Trigger Ingestion
        </a>
        <a th:href="@{/ingest/status}" th:class="${activePage == 'status'} ? 'tab active' : 'tab'">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M11 9h2V7h-2v2zm0 8h2v-6h-2v6zm1-16C6.48 1 2 5.48 2 11s4.48 10 10 10 10-4.48 10-10S17.52 1 12 1zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            Ingestion Status
        </a>
    </div>
</div>
</body>
</html>
