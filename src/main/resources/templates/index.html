<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chat — ServiceCodeChat</title>
    <link rel="stylesheet" href="/css/main.css"/>
    <style>
        body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* ── Chat scaffold ──────────────────────────────────────────── */
        .chat-root {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--clr-bg);
        }

        /* ── Messages ───────────────────────────────────────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--clr-outline-var); border-radius: 99px; }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            padding: 40px 24px;
        }
        .empty-icon-wrap {
            width: 72px; height: 72px;
            background: var(--clr-surf-base);
            background-image: linear-gradient(var(--elev-1), var(--elev-1));
            border: 1px solid var(--clr-outline-var);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 4px;
        }
        .empty-title { font-size: 17px; font-weight: 600; color: var(--clr-on-surface); }
        .empty-sub   { font-size: 14px; color: var(--clr-on-surf-var); max-width: 320px; line-height: 1.55; }

        /* ── Message rows ───────────────────────────────────────────── */
        .msg-row { display: flex; gap: 10px; max-width: 780px; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot  { align-self: flex-start; }

        .msg-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 15px;
        }
        .msg-avatar.user { background: var(--clr-primary-container); }
        .msg-avatar.bot {
            background: var(--clr-surf-high);
            border: 1px solid var(--clr-outline-var);
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.6;
            max-width: 620px;
        }
        .msg-row.user .bubble {
            background: var(--clr-primary-container);
            color: var(--clr-on-primary-container);
            border-bottom-right-radius: 4px;
        }
        .msg-row.bot .bubble {
            background: var(--clr-surf-high);
            border: 1px solid var(--clr-outline-var);
            border-bottom-left-radius: 4px;
        }

        /* Structured response inside bot bubble */
        .resp-header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
        .resp-code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            background: rgba(190,194,255,0.12);
            color: var(--clr-primary);
            padding: 2px 8px; border-radius: 6px;
            letter-spacing: 0.02em;
        }
        .resp-section { margin-top: 10px; }
        .resp-label {
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--clr-on-surf-faint); margin-bottom: 3px;
        }
        .resp-arabic {
            direction: rtl; text-align: right;
            font-size: 14px; color: var(--clr-on-surf-var);
            background: rgba(255,255,255,0.03);
            border-radius: var(--r-sm); padding: 6px 10px;
        }
        .resp-excerpt {
            font-size: 13px; color: var(--clr-on-surf-var);
            border-left: 2px solid var(--clr-outline-var);
            padding-left: 10px; font-style: italic;
        }

        /* Typing indicator */
        .typing-dots { display: flex; gap: 5px; align-items: center; padding: 2px 2px; }
        .typing-dots span {
            width: 7px; height: 7px;
            background: var(--clr-on-surf-faint); border-radius: 50%;
            animation: bounce 1.2s ease infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes bounce {
            0%,80%,100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        /* ── Input bar ──────────────────────────────────────────────── */
        .input-bar {
            padding: 12px 16px 16px;
            background: var(--clr-surf-base);
            background-image: linear-gradient(var(--elev-1), var(--elev-1));
            border-top: 1px solid var(--clr-outline-var);
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .new-btn {
            all: unset;
            cursor: pointer;
            height: 40px; min-width: 40px;
            padding: 0 14px;
            border-radius: var(--r-full);
            background: var(--clr-surf-high);
            color: var(--clr-on-surf-var);
            font-family: var(--font);
            font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 5px;
            transition: background var(--dur-s), color var(--dur-s);
            flex-shrink: 0;
        }
        .new-btn:hover  { background: var(--clr-surf-highest); color: var(--clr-on-surface); }
        .new-btn:active { background: var(--clr-surf-highest); }

        .input-field-wrap {
            flex: 1;
            background: var(--clr-surf-high);
            border: 1px solid var(--clr-outline-var);
            border-radius: 24px;
            display: flex; align-items: flex-end;
            padding: 8px 14px;
            transition: border-color var(--dur-s) var(--ease);
            min-height: 44px;
        }
        .input-field-wrap:focus-within { border-color: var(--clr-primary); }

        #chat-input {
            flex: 1;
            background: transparent; border: none; outline: none;
            color: var(--clr-on-surface);
            font-size: 14.5px; font-family: var(--font);
            line-height: 1.5; resize: none;
            max-height: 140px; overflow-y: auto;
            caret-color: var(--clr-primary);
            align-self: center;
        }
        #chat-input::placeholder { color: var(--clr-on-surf-faint); }

        .send-btn {
            all: unset;
            cursor: pointer;
            width: 40px; height: 40px;
            border-radius: var(--r-full);
            background: var(--clr-primary);
            color: var(--clr-on-primary);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: box-shadow var(--dur-s) var(--ease), opacity var(--dur-s);
            position: relative; overflow: hidden;
        }
        .send-btn::before {
            content: ''; position: absolute; inset: 0;
            background: var(--clr-on-primary); opacity: 0;
            transition: opacity var(--dur-s); border-radius: inherit;
        }
        .send-btn:hover { box-shadow: 0 2px 8px rgba(190,194,255,0.2); }
        .send-btn:hover::before  { opacity: 0.08; }
        .send-btn:active::before { opacity: 0.12; }
        .send-btn:disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar('chat')}"></div>

<div class="chat-root">
    <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
            <div class="empty-icon-wrap">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="8" stroke="var(--clr-primary)" stroke-width="2"/>
                    <path d="M21 21l-4.35-4.35" stroke="var(--clr-primary)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M8 11h6M11 8v6" stroke="var(--clr-outline)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="empty-title">Ask about a government service</div>
            <div class="empty-sub">Type a question in Arabic or English to find service codes from the knowledge base.</div>
        </div>
    </div>

    <div class="input-bar">
        <button class="new-btn" onclick="newConversation()" title="New conversation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/>
            </svg>
            New
        </button>
        <div class="input-field-wrap">
            <textarea id="chat-input" rows="1"
                      placeholder="Ask in Arabic or English…"
                      oninput="autoResize(this)"
                      onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    var conversationId = crypto.randomUUID();
    var isLoading = false;

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }
    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }
    function newConversation() {
        conversationId = crypto.randomUUID();
        document.getElementById('messages').innerHTML = `
            <div class="empty-state" id="empty-state">
                <div class="empty-icon-wrap">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="var(--clr-primary)" stroke-width="2"/>
                        <path d="M21 21l-4.35-4.35" stroke="var(--clr-primary)" stroke-width="2" stroke-linecap="round"/>
                        <path d="M8 11h6M11 8v6" stroke="var(--clr-outline)" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="empty-title">Ask about a government service</div>
                <div class="empty-sub">Type a question in Arabic or English to find service codes from the knowledge base.</div>
            </div>`;
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const query = input.value.trim();
        if (!query || isLoading) return;

        document.getElementById('empty-state')?.remove();
        appendUserMsg(query);
        input.value = ''; input.style.height = 'auto';
        const typId = appendTyping();
        setLoading(true);

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, conversationId })
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: 'Request failed.' }));
                appendErrMsg(err.error || 'Request failed.');
                removeEl(typId);
                setLoading(false);
            } else {
                const job = await res.json();
                pollChatResult(job.jobId, typId);
            }
        } catch (e) {
            appendErrMsg('Could not reach the server.');
            removeEl(typId);
            setLoading(false);
        }
    }

    function pollChatResult(jobId, typId) {
        setTimeout(async function poll() {
            try {
                const res = await fetch('/api/chat/result/' + jobId);
                if (res.status === 202) {
                    setTimeout(poll, 3000);
                    return;
                }
                removeEl(typId);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({ error: 'Request failed.' }));
                    appendErrMsg(err.error || 'Request failed.');
                } else {
                    appendBotMsg(await res.json());
                }
            } catch (e) {
                removeEl(typId);
                appendErrMsg('Could not reach the server.');
            }
            setLoading(false);
        }, 3000);
    }

    function setLoading(v) {
        isLoading = v;
        document.getElementById('send-btn').disabled = v;
    }

    function appendUserMsg(text) {
        appendMsg(`
            <div class="msg-row user fade-up">
                <div class="msg-avatar user">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--clr-on-primary-container)">
                        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                    </svg>
                </div>
                <div class="bubble">${esc(text)}</div>
            </div>`);
    }

    function appendTyping() {
        const id = 'typ-' + Date.now();
        appendMsg(`
            <div class="msg-row bot" id="${id}">
                <div class="msg-avatar bot">✨</div>
                <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
            </div>`);
        return id;
    }

    function appendBotMsg(r) {
        const confMap = { HIGH:'chip-primary', MEDIUM:'chip-warning', LOW:'chip-error' };
        const foundChip = r.found
            ? `<span class="chip chip-success"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Found</span>`
            : `<span class="chip chip-error"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>Not Found</span>`;
        const confChip = r.confidence
            ? `<span class="chip ${confMap[r.confidence] || 'chip-surface'}">${r.confidence}</span>` : '';
        const codeEl = (r.codeNumber || r.serviceCode)
            ? `<span class="resp-code">${esc(r.codeNumber || r.serviceCode)}</span>` : '';

        let html = `<div class="msg-row bot fade-up">
            <div class="msg-avatar bot">✨</div>
            <div class="bubble">
                <div class="resp-header">${foundChip}${confChip}${codeEl}</div>
                <div style="font-size:14px">${esc(r.description || 'No description available.')}</div>`;

        if (r.serviceNameEnglish || r.serviceNameArabic) {
            html += `<div class="resp-section"><div class="resp-label">Service Name</div>`;
            if (r.serviceNameEnglish) html += `<div style="font-size:14px">${esc(r.serviceNameEnglish)}</div>`;
            if (r.serviceNameArabic)  html += `<div class="resp-arabic">${esc(r.serviceNameArabic)}</div>`;
            html += `</div>`;
        }
        if (r.additionalInfo) {
            html += `<div class="resp-section"><div class="resp-label">Details</div>
                <div style="font-size:13.5px;color:var(--clr-on-surf-var)">${esc(r.additionalInfo)}</div></div>`;
        }
        if (r.arabicSourceExcerpt) {
            html += `<div class="resp-section"><div class="resp-label">Source Excerpt</div>
                <div class="resp-excerpt resp-arabic">${esc(r.arabicSourceExcerpt)}</div></div>`;
        }
        html += `</div></div>`;
        appendMsg(html);
    }

    function appendErrMsg(text) {
        appendMsg(`<div class="msg-row bot fade-up">
            <div class="msg-avatar bot">✨</div>
            <div class="bubble" style="border-color:rgba(255,180,171,0.3)">
                <span style="color:var(--clr-error)">⚠ ${esc(text)}</span>
            </div></div>`);
    }

    function appendMsg(html) {
        const c = document.getElementById('messages');
        const el = document.createElement('div');
        el.innerHTML = html;
        c.appendChild(el.firstElementChild);
        c.scrollTop = c.scrollHeight;
    }
    function removeEl(id) { document.getElementById(id)?.remove(); }
    function esc(s) {
        if (!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
    }
</script>
</body>
</html>
