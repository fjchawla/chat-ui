<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chat — ServiceCodeChat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --bg-base:    #0f172a;
            --bg-surface: #1e293b;
            --bg-raised:  #273549;
            --border:     #334155;
            --text-primary:   #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:     #64748b;
            --accent:         #6366f1;
            --accent-hover:   #4f46e5;
            --user-bubble:    #3730a3;
            --bot-bubble:     #273549;
            --success:        #22c55e;
            --warning:        #f59e0b;
            --error:          #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        /* ── Shared Nav ─────────────────────────────────────────────── */
        .top-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            height: 56px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }
        .brand-dot {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .user-info { font-size: 0.8rem; color: var(--text-secondary); }
        .btn-logout {
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }
        .tab-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            display: flex;
            gap: 0.125rem;
            flex-shrink: 0;
        }
        .tab {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0 0.875rem;
            height: 40px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* ── Chat area ───────────────────────────────────────────────── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        .msg-row {
            display: flex;
            gap: 0.75rem;
            max-width: 800px;
        }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot  { align-self: flex-start; }

        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .avatar.user { background: var(--user-bubble); }
        .avatar.bot  { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            max-width: 640px;
        }
        .msg-row.user .bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }
        .msg-row.bot .bubble {
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .resp-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .resp-badge.found    { background: rgba(34,197,94,0.15); color: #86efac; }
        .resp-badge.notfound { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .resp-badge.high     { background: rgba(99,102,241,0.2); color: #a5b4fc; }
        .resp-badge.medium   { background: rgba(245,158,11,0.15); color: #fcd34d; }
        .resp-badge.low      { background: rgba(239,68,68,0.15); color: #fca5a5; }
        .resp-code {
            font-family: 'SF Mono', 'Fira Mono', monospace;
            font-size: 0.8rem;
            background: rgba(99,102,241,0.15);
            color: #a5b4fc;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        .resp-section { margin-top: 0.625rem; }
        .resp-section-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .resp-arabic {
            direction: rtl;
            text-align: right;
            font-size: 0.875rem;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
        }
        .resp-excerpt {
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-left: 2px solid var(--border);
            padding-left: 0.6rem;
            font-style: italic;
        }

        .typing-indicator {
            display: flex; gap: 4px; align-items: center;
            padding: 0.75rem 1rem;
        }
        .typing-indicator span {
            width: 7px; height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,80%,100% { transform: translateY(0); }
            40%          { transform: translateY(-6px); }
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            gap: 0.75rem;
        }
        .empty-icon { font-size: 3rem; opacity: 0.5; }

        /* ── Input bar ───────────────────────────────────────────────── */
        .input-bar {
            padding: 1rem 1.25rem;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 0.5rem 0.875rem;
            transition: border-color 0.15s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); }
        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            max-height: 150px;
            overflow-y: auto;
            font-family: inherit;
        }
        #chat-input::placeholder { color: var(--text-muted); }
        .btn-send {
            width: 40px; height: 40px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-send:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-send svg { width: 18px; height: 18px; fill: white; }

        .new-chat-btn {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .new-chat-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar('chat')}"></div>

<div class="chat-area">
    <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">🔍</div>
            <div style="font-size:1rem; font-weight:600; color:var(--text-secondary)">Ask about a service</div>
            <div style="font-size:0.85rem;">Type a question in Arabic or English to find government service codes.</div>
        </div>
    </div>

    <div class="input-bar">
        <button class="new-chat-btn" onclick="newConversation()" title="Start a new conversation">↺ New</button>
        <div class="input-wrapper">
            <textarea id="chat-input" rows="1"
                      placeholder="Ask in Arabic or English…"
                      oninput="autoResize(this)"
                      onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="btn-send" id="send-btn" onclick="sendMessage()" title="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    let conversationId = crypto.randomUUID();
    let isLoading = false;

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function newConversation() {
        conversationId = crypto.randomUUID();
        document.getElementById('messages').innerHTML =
            `<div class="empty-state" id="empty-state">
                <div class="empty-icon">🔍</div>
                <div style="font-size:1rem;font-weight:600;color:var(--text-secondary)">Ask about a service</div>
                <div style="font-size:0.85rem;">Type a question in Arabic or English to find government service codes.</div>
            </div>`;
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const query = input.value.trim();
        if (!query || isLoading) return;

        hideEmptyState();
        appendUserMessage(query);
        input.value = '';
        input.style.height = 'auto';

        const typingId = appendTypingIndicator();
        setLoading(true);

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, conversationId })
            });
            removeTypingIndicator(typingId);
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: 'Request failed.' }));
                appendErrorMessage(err.error || 'Request failed.');
            } else {
                appendBotMessage(await res.json());
            }
        } catch (e) {
            removeTypingIndicator(typingId);
            appendErrorMessage('Could not reach the server. Is the backend running?');
        } finally {
            setLoading(false);
        }
    }

    function hideEmptyState() {
        document.getElementById('empty-state')?.remove();
    }

    function setLoading(val) {
        isLoading = val;
        document.getElementById('send-btn').disabled = val;
    }

    function appendUserMessage(text) {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="avatar user">👤</div><div class="bubble">${escHtml(text)}</div>`;
        appendMsg(row);
    }

    function appendTypingIndicator() {
        const id = 'typing-' + Date.now();
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.id = id;
        row.innerHTML = `<div class="avatar bot">✨</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
        appendMsg(row);
        return id;
    }

    function removeTypingIndicator(id) { document.getElementById(id)?.remove(); }

    function appendBotMessage(r) {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        const confidenceCls = (r.confidence || '').toLowerCase();
        const foundBadge = r.found
            ? `<span class="resp-badge found">✓ Found</span>`
            : `<span class="resp-badge notfound">✗ Not Found</span>`;
        const confBadge = r.confidence ? `<span class="resp-badge ${confidenceCls}">${r.confidence}</span>` : '';
        const codeSpan = r.serviceCode ? `<span class="resp-code">${escHtml(r.serviceCode)}</span> ` : '';

        let html = `<div class="avatar bot">✨</div><div class="bubble">
            <div class="mb-2">${foundBadge} ${confBadge} ${codeSpan}</div>
            <div>${escHtml(r.description || 'No description available.')}</div>`;

        if (r.serviceNameEnglish || r.serviceNameArabic) {
            html += `<div class="resp-section"><div class="resp-section-label">Service Name</div>`;
            if (r.serviceNameEnglish) html += `<div>${escHtml(r.serviceNameEnglish)}</div>`;
            if (r.serviceNameArabic)  html += `<div class="resp-arabic">${escHtml(r.serviceNameArabic)}</div>`;
            html += `</div>`;
        }
        if (r.additionalInfo) {
            html += `<div class="resp-section"><div class="resp-section-label">Details</div>
                <div style="font-size:0.85rem;color:var(--text-secondary)">${escHtml(r.additionalInfo)}</div></div>`;
        }
        if (r.arabicSourceExcerpt) {
            html += `<div class="resp-section"><div class="resp-section-label">Source Excerpt</div>
                <div class="resp-excerpt resp-arabic">${escHtml(r.arabicSourceExcerpt)}</div></div>`;
        }
        html += `</div>`;
        row.innerHTML = html;
        appendMsg(row);
    }

    function appendErrorMessage(text) {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.innerHTML = `<div class="avatar bot">✨</div>
            <div class="bubble" style="border-color:rgba(239,68,68,0.3)">
                <span style="color:#fca5a5">⚠ ${escHtml(text)}</span></div>`;
        appendMsg(row);
    }

    function appendMsg(el) {
        const container = document.getElementById('messages');
        container.appendChild(el);
        container.scrollTop = container.scrollHeight;
    }

    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
    }
</script>
</body>
</html>
